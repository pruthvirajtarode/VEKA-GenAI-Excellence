<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEKA Data Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #09090b; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa;
      --border: #3f3f46; --red: #E4002B;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(24,24,27,0.8); backdrop-filter: blur(10px); }
    header h1 { font-size: 20px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
    header h1::before { content:''; width:12px; height:12px; background:var(--red); display:block; border-radius:2px; }
    
    .layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; display: flex; flex-direction: column; }
    .nav-item { padding: 12px 24px; cursor: pointer; border-left: 3px solid transparent; transition: 0.2s; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
    .nav-item:hover { background: rgba(255,255,255,0.05); }
    .nav-item.active { border-left-color: var(--red); background: rgba(228,0,43,0.1); color: #fff; }
    
    .main { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
    h2 { margin-top: 0; font-size: 24px; font-weight: 600; margin-bottom: 4px; }
    p.desc { color: var(--muted); margin-bottom: 0; }
    
    .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; height: 300px; display: flex; align-items: center; justify-content: center; }
    
    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; flex: 1; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 16px; background: rgba(255,255,255,0.02); font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--border); text-transform: uppercase; white-space: nowrap; position: sticky; top: 0; }
    td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; color: #d4d4d8; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    
    .loading { text-align: center; color: var(--muted); padding: 40px; font-family: 'JetBrains Mono'; }
  </style>
</head>
<body>

  <header>
    <h1><a href="../index.html" style="color:inherit; text-decoration:none;" title="Return to Home">VEKA Data Lab</a></h1>
    <span style="font-size:12px; color:var(--muted); font-family:'JetBrains Mono';">SYNTHETIC_DATA_ENVIRONMENT</span>
  </header>

  <div class="layout">
    <div class="sidebar">
      <div class="nav-item active" onclick="loadCSV('VEKA_PRODUCTION_MAINTENANCE_TRAINING.csv', this)">⚙️ Production & Maintenance</div>
      <div class="nav-item" onclick="loadCSV('VEKA_SALES_DISTRIBUTION_TRAINING.csv', this)">📦 Sales & Distribution</div>
      <div class="nav-item" onclick="loadCSV('VEKA_FINANCE_OPERATIONS_TRAINING.csv', this)">💰 Finance Operations</div>
      <div style="margin-top: auto; padding: 20px; border-top: 1px solid var(--border);">
        <a href="../index.html" style="display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; background:rgba(255,255,255,0.05); border-radius:8px; color:var(--text); text-decoration:none; font-size:14px; transition:0.2s;">
          🏠 Return to Home
        </a>
      </div>
    </div>
    
    <div class="main">
      <div>
        <h2 id="viewTitle">Production & Maintenance Data</h2>
        <p class="desc">Synthetic dataset for AI analysis training. 500+ records.</p>
      </div>

      <div class="chart-container">
        <canvas id="dataChart"></canvas>
      </div>
      
      <div class="table-wrap">
        <table id="dataTable">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"><tr><td class="loading">Loading dataset...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let currentChart = null;

    async function loadCSV(filename, el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('viewTitle').innerText = el.innerText.substring(3) + ' Data';
      
      document.getElementById('tbody').innerHTML = '<tr><td class="loading">Parsing dataset...</td></tr>';
      document.getElementById('thead').innerHTML = '';

      try {
        const res = await fetch(`../data/synthetic/${filename}`);
        if (!res.ok) throw new Error("Dataset not found.");
        const text = await res.text();
        
        // Simple CSV parser
        const rows = text.trim().split('\n').map(row => {
          let cols = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < row.length; i++) {
            if (row[i] === '"') inQuotes = !inQuotes;
            else if (row[i] === ',' && !inQuotes) { cols.push(cur); cur = ''; }
            else cur += row[i];
          }
          cols.push(cur);
          return cols;
        });

        if (rows.length === 0) return;

        const headers = rows.shift();
        document.getElementById('thead').innerHTML = headers.map(h => `<th>${h}</th>`).join('');
        
        let bodyHtml = '';
        // Only show first 50 rows to keep DOM fast
        const limit = Math.min(rows.length, 50);
        for (let i = 0; i < limit; i++) {
          bodyHtml += '<tr>' + rows[i].map(c => `<td>${c}</td>`).join('') + '</tr>';
        }
        document.getElementById('tbody').innerHTML = bodyHtml;

        // Render Chart
        renderChart(headers, rows);

      } catch (err) {
        document.getElementById('tbody').innerHTML = `<tr><td class="loading" style="color:var(--red);">Error loading ${filename}</td></tr>`;
      }
    }

    function renderChart(headers, rows) {
      if (currentChart) {
        currentChart.destroy();
      }

      // Try to find a categorical column for labels (e.g., Machine_ID, Region, Vendor_Name)
      // and a numerical column for data (e.g., Downtime_Minutes, Order_Value, Invoice_Amount)
      let labelColIdx = 1; // Default fallback
      let dataColIdx = 2; // Default fallback

      for (let i = 0; i < headers.length; i++) {
        if (headers[i].toLowerCase().includes('id') || headers[i].toLowerCase().includes('name') || headers[i].toLowerCase().includes('region')) {
          labelColIdx = i;
        }
        if (headers[i].toLowerCase().includes('amount') || headers[i].toLowerCase().includes('value') || headers[i].toLowerCase().includes('minutes')) {
          dataColIdx = i;
        }
      }

      // Aggregate data
      const aggregatedData = {};
      rows.forEach(row => {
        const label = row[labelColIdx];
        let val = parseFloat(row[dataColIdx] || 0);
        if (isNaN(val)) val = 1; // Fallback to counting if not numeric
        
        if (aggregatedData[label]) {
          aggregatedData[label] += val;
        } else {
          aggregatedData[label] = val;
        }
      });

      // Sort and get top 10
      const sortedKeys = Object.keys(aggregatedData).sort((a, b) => aggregatedData[b] - aggregatedData[a]).slice(0, 10);
      const labels = sortedKeys;
      const data = sortedKeys.map(k => aggregatedData[k]);

      const ctx = document.getElementById('dataChart').getContext('2d');
      currentChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: headers[dataColIdx] + ' by ' + headers[labelColIdx] + ' (Top 10)',
            data: data,
            backgroundColor: 'rgba(228, 0, 43, 0.6)',
            borderColor: '#E4002B',
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#f4f4f5', font: { family: 'Inter' } } }
          },
          scales: {
            y: { beginAtZero: true, grid: { color: '#3f3f46' }, ticks: { color: '#a1a1aa', font: { family: 'JetBrains Mono' } } },
            x: { grid: { display: false }, ticks: { color: '#a1a1aa', font: { family: 'Inter' } } }
          }
        }
      });
    }

    // Load first by default
    window.onload = () => loadCSV('VEKA_PRODUCTION_MAINTENANCE_TRAINING.csv', document.querySelector('.nav-item'));
  </script>
</body>
</html>
